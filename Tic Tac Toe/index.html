<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top glass">
  <h1>XO</h1>
  <p class="sub">Enter players' names</p>
  <div class="players">
    <label class="player glass" id="p0">
      <span class="badge b0">X</span>
      <input id="in0" maxlength="12" placeholder="Player 1 name" autocomplete="off" aria-label="Player 1 name">
    </label>
    <span class="vs">VS</span>
    <label class="player glass" id="p1">
      <span class="badge b1">O</span>
      <input id="in1" maxlength="12" placeholder="Player 2 name" autocomplete="off" aria-label="Player 2 name">
    </label>
  </div>
</header>

<div class="stage">
  <main class="board glass" id="board">
    <div class="grid" id="grid"><div class="line" id="line"></div></div>
  </main>
</div>

<div class="bottom">
  <div class="res glass" id="res"></div>
  <div class="row">
    <div class="glass score"><span id="l0"></span><b id="v0">0</b></div>
    <div class="glass score"><span>Draws</span><b id="vd">0</b></div>
    <div class="glass score"><span id="l1"></span><b id="v1">0</b></div>
  </div>
  <div class="row">
    <button class="glass btn" id="again">New Round</button>
    <button class="glass btn" id="reset">Reset Scores</button>
  </div>
</div>


<script src="app.js"></script>
</body>
</html>
